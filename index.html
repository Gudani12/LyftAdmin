<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HopOn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { deep: '#1d1135', dark: '#5A189A', accent: '#9D4EDD' },
              ui: { surface: '#FFFFFF', ink: '#21152F', muted: '#746A7E', faint: '#A69BAF', border: '#E9E2F0' },
              deep: { DEFAULT: '#1d1135', 800: '#1d1135', 700: '#2C1749', 600: '#3A2162' },
              ink: '#21152F',
              paper: '#F7F3FA',
              accent: { DEFAULT: '#9D4EDD', 50: '#F3E9FF', 100: '#E9D7FF', 600: '#5A189A', 700: '#3F1B69' },
              good: { DEFAULT: '#9D4EDD', bg: '#F3E9FF' },
              info: { DEFAULT: '#5A189A', bg: '#F3E9FF' },
              mint: '#D9B9FF',
              tint: '#F3E9FF',
              bad: { DEFAULT: '#E04545', bg: '#FDE9E9' },
              slate2: { DEFAULT: '#746A7E', bg: '#F3E9FF' },
              amber: { DEFAULT: '#BA8CFF', bg: '#F3E9FF' }
            },
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      html { font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #D8D8D2; border-radius: 8px; }
      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(216,53,58,0.45); }
        70% { box-shadow: 0 0 0 8px rgba(190, 48, 53, 0); }
        100% { box-shadow: 0 0 0 0 rgba(216,53,58,0); }
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes softGlow {
        0%, 100% { box-shadow: 0 0 0 rgba(14, 92, 63, 0.15), 0 0 0 rgba(14, 92, 63, 0.08); }
        50% { box-shadow: 0 0 18px rgba(14, 92, 63, 0.15), 0 0 32px rgba(111, 239, 180, 0.12); }
      }
      .sos-pulse { animation: pulse-ring 1.6s infinite; }
      .animate-fade-in-up { animation: fadeInUp 0.45s ease-out both; }
      .soft-glow { animation: softGlow 3.2s ease-in-out infinite; }
    </style>
  </head>
  <body class="bg-paper text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
